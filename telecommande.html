<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12002e">
<title>🎛 Télécommande — Parents VS Enfants</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  min-height: 100%;
  background: linear-gradient(160deg, #12002e, #2a0a5e 60%, #0a1445);
  font-family: 'Segoe UI', system-ui, Arial, sans-serif;
  color: #fff;
  user-select: none;
}
body { padding: 12px 12px 30px; max-width: 480px; margin: 0 auto; }

h1 { font-size: 20px; text-align: center; margin: 8px 0 4px; }
h1 .e { color: #00d9ff; } h1 .p { color: #ff2e88; }
.sous { text-align: center; font-size: 13px; color: rgba(255,255,255,.6); margin-bottom: 14px; }

button {
  border: none; border-radius: 12px; cursor: pointer;
  font-family: inherit; font-weight: 700; color: #fff;
  background: #3a3a55;
  padding: 14px 10px; font-size: 16px;
  touch-action: manipulation;
}
button:active { transform: scale(.96); filter: brightness(1.25); }
button:disabled { opacity: .35; }

.vert  { background: #1d7a3a; }
.rouge { background: #a02030; }
.bleu  { background: #135a80; }
.rose  { background: #8a1f52; }
.or    { background: #8a6a00; }
.violet{ background: #5a1bd6; }

/* --- Connexion --- */
#connexion { display: flex; flex-direction: column; gap: 14px; margin-top: 8vh; }
#connexion input {
  font-size: 30px; text-align: center; letter-spacing: .4em; text-transform: uppercase;
  padding: 14px; border-radius: 12px; border: 2px solid #5a1bd6;
  background: rgba(0,0,0,.4); color: #ffd24a; width: 100%;
  font-family: inherit; font-weight: 700; outline: none;
}
#statut { text-align: center; font-size: 14px; color: rgba(255,255,255,.7); min-height: 20px; }

/* --- Onglets --- */
#onglets { display: none; gap: 8px; margin-bottom: 12px; }
#onglets.actif { display: flex; }
#onglets button { flex: 1; background: #22183a; font-size: 15px; padding: 12px; }
#onglets button.choisi { background: #5a1bd6; }

/* --- Pilotage --- */
#pilotage { display: none; flex-direction: column; gap: 12px; }
#pilotage.actif { display: flex; }

.scores { display: flex; gap: 8px; }
.eq {
  flex: 1; border-radius: 14px; padding: 8px; text-align: center;
  background: rgba(0,0,0,.35); border: 2px solid transparent;
}
.eq.a-toi.enfants { border-color: #00d9ff; box-shadow: 0 0 12px rgba(0,217,255,.5); }
.eq.a-toi.adultes { border-color: #ff2e88; box-shadow: 0 0 12px rgba(255,46,136,.5); }
.eq .nom { font-size: 13px; font-weight: 700; }
.eq.enfants .nom, .eq.enfants .val { color: #00d9ff; }
.eq.adultes .nom, .eq.adultes .val { color: #ff2e88; }
.eq .val { font-size: 34px; font-weight: 900; line-height: 1.1; }
.eq .pm { display: flex; gap: 6px; justify-content: center; margin-top: 6px; }
.eq .pm button { padding: 8px 0; width: 52px; font-size: 18px; }
.eq .bdg { font-size: 11px; color: #ffd24a; min-height: 14px; margin-top: 3px; }

#tour-bar {
  text-align: center; padding: 10px; border-radius: 12px;
  background: rgba(0,0,0,.35); font-weight: 700; font-size: 15px; width: 100%;
}

/* Mur */
#grille { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
#grille button { padding: 0; height: 52px; font-size: 18px; background: #4316a8; }
#grille button.usee { background: #22183a; color: rgba(255,255,255,.35); font-size: 14px; }

/* Épreuve */
.carte-info {
  background: rgba(0,0,0,.4); border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.carte-info .type { font-weight: 900; font-size: 15px; color: #ffd24a; }
.carte-info .txt { font-size: 17px; font-weight: 700; line-height: 1.3; }
.carte-info .csg { font-size: 13px; color: rgba(255,255,255,.65); }
.rep {
  background: rgba(0,80,30,.5); border: 1px solid #7CFF9B; border-radius: 10px;
  padding: 10px; font-size: 15px; font-weight: 700; color: #7CFF9B;
}
.sec {
  background: rgba(120,80,0,.4); border: 1px solid #ffd24a; border-radius: 10px;
  padding: 10px; font-size: 15px; font-weight: 700; color: #ffd24a;
}
.ind { font-size: 13px; color: rgba(255,255,255,.6); }

.rangee { display: flex; gap: 8px; }
.rangee button { flex: 1; }
.grosse button { padding: 18px 10px; font-size: 17px; }

#bas { display: flex; gap: 8px; margin-top: 6px; }
#bas button { flex: 1; font-size: 13px; padding: 10px 6px; }
#etat-connexion { text-align: center; font-size: 12px; color: rgba(255,255,255,.5); }

/* --- Onglet Cartes (édition) --- */
#parametres { display: none; flex-direction: column; gap: 10px; }
#parametres.actif { display: flex; }
#filtres { display: flex; gap: 6px; }
#filtres button { flex: 1; font-size: 13px; padding: 10px 4px; background: #22183a; }
#filtres button.choisi { background: #135a80; }
.carte-ligne {
  background: rgba(0,0,0,.35); border-radius: 12px; overflow: hidden;
}
.carte-ligne .entete {
  width: 100%; text-align: left; background: transparent;
  padding: 12px; font-size: 14px; border-radius: 0;
  display: flex; gap: 8px; align-items: baseline;
}
.carte-ligne .entete .num { color: #ffd24a; font-weight: 900; min-width: 30px; }
.carte-ligne .entete .apercu {
  flex: 1; font-weight: 400; color: rgba(255,255,255,.75);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.editeur { display: none; padding: 0 12px 12px; flex-direction: column; gap: 8px; }
.carte-ligne.ouverte .editeur { display: flex; }
.editeur label { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 4px; }
.editeur input, .editeur textarea {
  width: 100%; border-radius: 8px; border: 1px solid #3a3a55;
  background: rgba(0,0,0,.45); color: #fff; padding: 9px;
  font-family: inherit; font-size: 14px; outline: none;
  user-select: text; -webkit-user-select: text;
}
.editeur textarea { min-height: 56px; resize: vertical; }
.editeur .enregistrer { background: #1d7a3a; margin-top: 6px; }
.notif {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #1d7a3a; padding: 10px 22px; border-radius: 20px;
  font-weight: 700; font-size: 14px; z-index: 50;
  animation: notif-in .25s ease;
}
@keyframes notif-in { from { opacity: 0; transform: translateX(-50%) translateY(10px); } }
</style>
</head>
<body>

<h1>🎛 <span class="e">ENFANTS</span> VS <span class="p">PARENTS</span></h1>
<div class="sous">Télécommande du présentateur</div>

<!-- CONNEXION -->
<div id="connexion">
  <div style="text-align:center;font-size:15px">Entre le code affiché sur le grand écran :</div>
  <input id="champ-code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
  <button class="violet" id="btn-connecter" style="font-size:18px;padding:16px">📡 SE CONNECTER</button>
  <div id="statut"></div>
</div>

<!-- ONGLETS -->
<div id="onglets">
  <button id="ong-jeu" class="choisi">🎮 Jeu</button>
  <button id="ong-cartes">🗂 Cartes</button>
</div>

<!-- PILOTAGE -->
<div id="pilotage">
  <div class="scores">
    <div class="eq enfants" id="eq-enfants">
      <div class="nom">🧒 ENFANTS</div>
      <div class="val" id="sc-enfants">0</div>
      <div class="bdg" id="bdg-enfants"></div>
      <div class="pm">
        <button class="bleu" data-cmd="score" data-eq="enfants" data-d="1">+1</button>
        <button data-cmd="score" data-eq="enfants" data-d="-1">−1</button>
      </div>
    </div>
    <div class="eq adultes" id="eq-adultes">
      <div class="nom">🧑 PARENTS</div>
      <div class="val" id="sc-adultes">0</div>
      <div class="bdg" id="bdg-adultes"></div>
      <div class="pm">
        <button class="rose" data-cmd="score" data-eq="adultes" data-d="1">+1</button>
        <button data-cmd="score" data-eq="adultes" data-d="-1">−1</button>
      </div>
    </div>
  </div>

  <button id="tour-bar" data-cmd="tour">🔄 …</button>

  <div id="zone"></div>

  <button id="btn-defi" style="background:linear-gradient(135deg,#b8860b,#8a6a00);font-size:17px;padding:16px">🥁 DÉFI SURPRISE !</button>

  <div id="bas">
    <button class="or" data-cmd="victoire">🏆 Fin</button>
    <button id="btn-nouvelle">♻ Nouvelle partie</button>
  </div>
  <div id="etat-connexion"></div>
</div>

<!-- ONGLET CARTES -->
<div id="parametres">
  <div style="font-size:13px;color:rgba(255,255,255,.65);line-height:1.4">
    Modifie ici le contenu des cartes. Les changements sont appliqués immédiatement
    sur le grand écran et <b>sauvegardés sur place</b> (ils survivent au rechargement).
  </div>
  <div id="filtres">
    <button data-f="enfants" class="choisi">🧒 Enfants</button>
    <button data-f="adultes">🧑 Parents</button>
    <button data-f="commun">👥 Communes</button>
  </div>
  <div id="liste-cartes"></div>

  <div style="background:rgba(0,0,0,.35);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px">
    <div style="font-weight:900;font-size:15px;color:#ffd24a">💾 Mes jeux</div>
    <div id="jeu-actif" style="font-size:13px;color:rgba(255,255,255,.7)"></div>
    <div style="display:flex;gap:8px">
      <input id="nom-jeu" placeholder="Nom du jeu (ex : Maternelles)" maxlength="40"
        style="flex:1;border-radius:10px;border:1px solid #3a3a55;background:rgba(0,0,0,.45);color:#fff;padding:10px;font-family:inherit;font-size:14px;outline:none;user-select:text;-webkit-user-select:text">
      <button class="vert" id="btn-sauver-jeu" style="font-size:13px;padding:10px">💾 Enregistrer</button>
    </div>
    <div id="liste-jeux" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>

  <button class="bleu" id="btn-exporter" style="font-size:14px">⬇ Télécharger la sauvegarde (cartes.js)</button>
  <button id="btn-retablir" style="font-size:13px">↩ Rétablir les cartes d'origine</button>
</div>

<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const BROKERS = ["wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];

let client = null, code = "", etat = null, catalogue = null;
let connecte = false, brokerIdx = 0, timerEcranIntrouvable = null;
let confirmationReset = false, confirmationCartes = false;
let filtreActif = "enfants";
let cartesOuvertes = new Set();

/* ------------------------------------------------ Connexion MQTT */

const dernierCode = localStorage.getItem("pve-tel-code") || "";
$("champ-code").value = dernierCode;
$("btn-connecter").addEventListener("click", connecter);
$("champ-code").addEventListener("keydown", (e) => { if (e.key === "Enter") connecter(); });

function topicBase() { return "pve-veillee/" + code; }

function connecter() {
  code = $("champ-code").value.trim().toUpperCase();
  if (code.length !== 4) { $("statut").textContent = "Le code fait 4 caractères."; return; }
  localStorage.setItem("pve-tel-code", code);
  $("statut").textContent = "⏳ Connexion…";

  if (client) { try { client.end(true); } catch (e) {} }
  client = mqtt.connect(BROKERS[brokerIdx % BROKERS.length], {
    clientId: "pve-tel-" + code + "-" + Math.random().toString(36).slice(2, 8),
    clean: true,
    connectTimeout: 8000,
    reconnectPeriod: 4000,
  });

  let echecs = 0;
  client.on("connect", () => {
    echecs = 0;
    client.subscribe([topicBase() + "/etat", topicBase() + "/cartes"]);
    envoyer("hello");
    // L'état "retenu" du grand écran doit arriver presque instantanément
    clearTimeout(timerEcranIntrouvable);
    timerEcranIntrouvable = setTimeout(() => {
      if (!connecte) $("statut").textContent = "❌ Écran introuvable : vérifie le code, et que le grand écran est bien ouvert.";
    }, 8000);
  });
  client.on("message", (topic, payload) => {
    let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
    if (topic.endsWith("/etat")) { etat = d; premiereConnexion(); rendre(); }
    if (topic.endsWith("/cartes")) { catalogue = d; if ($("parametres").classList.contains("actif")) rendreCartes(); }
  });
  client.on("close", () => {
    if (connecte) $("etat-connexion").textContent = "⏳ Reconnexion…";
    echecs++;
    if (echecs >= 3) { echecs = 0; brokerIdx++; connecter(); }
  });

}

// Petit signe de vie régulier (maintient l'indicateur 📱✔ sur l'écran)
setInterval(() => { if (connecte) envoyer("ping"); }, 25000);

function premiereConnexion() {
  if (connecte) return;
  connecte = true;
  clearTimeout(timerEcranIntrouvable);
  $("connexion").style.display = "none";
  $("onglets").classList.add("actif");
  $("pilotage").classList.add("actif");
  $("etat-connexion").textContent = "📡 Connecté à l'écran (" + code + ")";
}

function envoyer(cmd, extra) {
  if (!client || !client.connected) return;
  try { client.publish(topicBase() + "/cmd", JSON.stringify(Object.assign({ cmd }, extra || {}))); } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(15);
}

/* ------------------------------------------------ Onglets */

$("ong-jeu").addEventListener("click", () => choisirOnglet("jeu"));
$("ong-cartes").addEventListener("click", () => choisirOnglet("cartes"));

function choisirOnglet(o) {
  $("ong-jeu").classList.toggle("choisi", o === "jeu");
  $("ong-cartes").classList.toggle("choisi", o === "cartes");
  $("pilotage").classList.toggle("actif", o === "jeu");
  $("parametres").classList.toggle("actif", o === "cartes");
  if (o === "cartes") rendreCartes();
}

/* ------------------------------------------------ Rendu du jeu */

const NOMS = { enfants: "ENFANTS", adultes: "PARENTS" };
const TYPES = {
  question: "❓ QUESTION", triche: "😈 QUESTION DIABOLIQUE", blindtest: "🎵 BLIND TEST",
  doubleblindtest: "🎶 DOUBLE BLIND TEST",
  mime: "🎭 MIME", defi: "💪 DÉFI", bonus: "🎁 BONUS", malus: "💣 MALUS",
  piege: "💀 CARTE PIÈGE", video: "🕺 ÉPREUVE VIDÉO",
};
const VITESSES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];

function rendre() {
  if (!etat) return;
  const defi = etat.defiSurprise || {};
  const btnDefi = $("btn-defi");
  btnDefi.textContent = defi.actif ? "⏹ TERMINER LE DÉFI SURPRISE" : "🥁 DÉFI SURPRISE !";
  btnDefi.style.background = defi.actif ? "#a02030" : "linear-gradient(135deg,#b8860b,#8a6a00)";
  $("sc-enfants").textContent = etat.scores.enfants;
  $("sc-adultes").textContent = etat.scores.adultes;
  $("bdg-enfants").textContent = (etat.badges.enfants || []).map(b => b.txt).join("  ");
  $("bdg-adultes").textContent = (etat.badges.adultes || []).map(b => b.txt).join("  ");
  $("eq-enfants").classList.toggle("a-toi", etat.tour === "enfants");
  $("eq-adultes").classList.toggle("a-toi", etat.tour === "adultes");
  $("tour-bar").textContent = "🔄 Au tour des " + NOMS[etat.tour] + " (toucher pour changer)";

  const z = $("zone");
  z.innerHTML = "";

  if (etat.ecran === "titre") {
    z.appendChild(bouton("▶ DÉMARRER LA VEILLÉE", "vert", () => envoyer("demarrer"), "padding:22px;font-size:19px;width:100%"));
    return;
  }
  if (etat.ecran === "victoire") {
    z.appendChild(bouton("⬅ Revenir au mur", "bleu", () => envoyer("retour"), "width:100%;padding:18px"));
    return;
  }
  if (etat.ecran === "mur") {
    const g = document.createElement("div");
    g.id = "grille";
    for (let n = 1; n <= 40; n++) {
      const b = document.createElement("button");
      const usage = etat.utilisees[n];
      b.textContent = usage ? "✕" : n;
      if (usage) { b.classList.add("usee"); b.disabled = true; }
      b.addEventListener("click", () => envoyer("carte", { n }));
      g.appendChild(b);
    }
    z.appendChild(g);
    return;
  }

  // --- Épreuve en cours ---
  const c = etat.carte;
  if (!c) return;

  const info = document.createElement("div");
  info.className = "carte-info";
  let html = `<div class="type">${TYPES[c.type] || c.type} — carte ${c.numero}`;
  if (c.points) html += ` — ⭐${c.points}${c.perte ? " / −" + c.perte : ""}`;
  html += `</div><div class="txt">${echap(c.texte)}</div>`;
  if (c.consigne) html += `<div class="csg">${echap(c.consigne)}</div>`;
  if (c.secret)   html += `<div class="sec">🤫 SECRET : ${echap(c.secret)}</div>`;
  if (c.reponse)  html += `<div class="rep">✅ Réponse : ${echap(c.reponse)}</div>`;
  if (c.indice)   html += `<div class="ind">🕵 Indice de triche : ${echap(c.indice)}</div>`;
  if (c.aDcc && c.dccMode) {
    const noms = { duo: "🎯 DUO", carre: "🔲 CARRÉ", cash: "💰 CASH" };
    html += `<div class="csg">Mode choisi : <b>${noms[c.dccMode]}</b> — ${c.dccPoints[c.dccMode]} pts en jeu</div>`;
  }
  info.innerHTML = html;
  z.appendChild(info);

  // Duo / Carré / Cash : choix du mode depuis le téléphone
  if (c.aDcc && !c.dccMode && c.dccPoints) {
    const dcc = document.createElement("div");
    dcc.className = "rangee grosse";
    dcc.style.marginTop = "8px";
    dcc.appendChild(bouton("🎯 DUO\n" + c.dccPoints.duo + " pt", "bleu", () => envoyer("dcc", { mode: "duo" })));
    dcc.appendChild(bouton("🔲 CARRÉ\n" + c.dccPoints.carre + " pts", "or", () => envoyer("dcc", { mode: "carre" })));
    dcc.appendChild(bouton("💰 CASH\n" + c.dccPoints.cash + " pts", "rouge", () => envoyer("dcc", { mode: "cash" })));
    z.appendChild(dcc);
  }

  if (c.type === "bonus" || c.type === "malus") {
    z.appendChild(bouton("➡ CONTINUER", "vert", () => envoyer("continuer"), "width:100%;padding:18px;margin-top:8px"));
    z.appendChild(bouton("⬅ Annuler la carte", "", () => envoyer("retour"), "width:100%;margin-top:8px"));
    return;
  }

  const outils = document.createElement("div");
  outils.className = "rangee";
  outils.style.marginTop = "8px";
  const chrono = etat.timerTotal
    ? "⏱ " + etat.timerRestant + "s" + (etat.timerActif ? " ⏸" : " ▶")
    : "⏱ —";
  if (etat.timerTotal) outils.appendChild(bouton(chrono, "bleu", () => envoyer("timer")));
  if (c.indice)  outils.appendChild(bouton("🕵 Indice", "or", () => envoyer("indice")));
  if (c.reponse) outils.appendChild(bouton("👁 Réponse", "bleu", () => envoyer("reponse")));
  if (c.media)   outils.appendChild(bouton("▶⏸", "violet", () => envoyer("musique")));
  if (outils.children.length) z.appendChild(outils);

  // Vitesse de lecture (ralenti / accéléré) + bonus « le public chante »
  if (c.media) {
    const vitesses = document.createElement("div");
    vitesses.className = "rangee";
    vitesses.style.marginTop = "8px";
    for (const v of VITESSES) {
      const label = v < 1 ? "🐌\n×" + v : (v === 1 ? "▶\n×1" : "⚡\n×" + v);
      const b = bouton(label, v === (c.vitesse || 1) ? "violet" : "", () => envoyer("vitesse", { taux: v }));
      b.style.cssText = "font-size:12px;padding:8px 2px;white-space:pre-line;line-height:1.3";
      if (v === (c.vitesse || 1)) b.style.outline = "2px solid #ffd24a";
      vitesses.appendChild(b);
    }
    z.appendChild(vitesses);

    const chante = document.createElement("div");
    chante.className = "rangee";
    chante.style.marginTop = "8px";
    chante.appendChild(bouton("🎤 Public chante ! +1 🧒", "bleu", () => envoyer("bonusPublic", { equipe: "enfants" })));
    chante.appendChild(bouton("🎤 Public chante ! +1 🧑", "rose", () => envoyer("bonusPublic", { equipe: "adultes" })));
    z.appendChild(chante);
  }

  const val = document.createElement("div");
  val.className = "rangee grosse";
  val.style.marginTop = "8px";
  if (c.validationCommune) {
    val.appendChild(bouton("🧒 ENFANTS", "bleu", () => envoyer("validerCommun", { gagnant: "enfants" })));
    val.appendChild(bouton("🧑 PARENTS", "rose", () => envoyer("validerCommun", { gagnant: "adultes" })));
    val.appendChild(bouton("Personne", "rouge", () => envoyer("validerCommun", { gagnant: null })));
  } else {
    val.appendChild(bouton("✔ RÉUSSI", "vert", () => envoyer("valider", { ok: true })));
    val.appendChild(bouton("✘ RATÉ", "rouge", () => envoyer("valider", { ok: false })));
  }
  z.appendChild(val);

  z.appendChild(bouton("⬅ Annuler (la carte redevient disponible)", "", () => envoyer("retour"), "width:100%;margin-top:8px;font-size:13px;padding:10px"));
}

function bouton(txt, classes, action, style) {
  const b = document.createElement("button");
  b.textContent = txt;
  if (classes) b.className = classes;
  if (style) b.style.cssText += style;
  b.addEventListener("click", action);
  return b;
}

function echap(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* ------------------------------------------------ Onglet Cartes (édition) */

const CHAMPS = [
  ["texte",    "Texte affiché en grand", "textarea"],
  ["consigne", "Consigne (petite ligne)", "textarea"],
  ["reponse",  "Réponse (touche R)", "textarea"],
  ["indice",   "Indice de triche (touche I)", "input"],
  ["secret",   "Secret du mime (nom caché)", "input"],
  ["youtube",  "Lien YouTube (musique 1 / vidéo)", "input"],
  ["youtube2", "Lien YouTube — musique 2 (double blind test)", "input"],
  ["musique",  "Fichier musique 1 (ou 📂 PC)", "input"],
  ["musique2", "Fichier musique 2 (double blind test)", "input"],
  ["video",    "Fichier vidéo (ou 📂 PC)", "input"],
];

document.querySelectorAll("#filtres button").forEach(b => {
  b.addEventListener("click", () => {
    filtreActif = b.dataset.f;
    document.querySelectorAll("#filtres button").forEach(x => x.classList.toggle("choisi", x === b));
    cartesOuvertes.clear();
    rendreCartes();
  });
});

function rendreCartes() {
  const liste = $("liste-cartes");
  liste.innerHTML = "";
  if (!catalogue) {
    liste.innerHTML = "<div style='text-align:center;color:rgba(255,255,255,.5);padding:20px'>⏳ En attente des cartes du grand écran…</div>";
    return;
  }
  const nums = Object.keys(catalogue.cartes).map(Number).sort((a, b) => a - b);
  for (const n of nums) {
    const carte = catalogue.cartes[n];
    const variante = carte[filtreActif];
    if (!variante) continue; // cette carte n'a pas de contenu pour ce filtre

    const ligne = document.createElement("div");
    ligne.className = "carte-ligne" + (cartesOuvertes.has(n) ? " ouverte" : "");

    const entete = document.createElement("button");
    entete.className = "entete";
    entete.innerHTML = `<span class="num">${String(n).padStart(2, "0")}</span>` +
      `<span>${(TYPES[carte.type] || carte.type).split(" ")[0]}</span>` +
      `<span class="apercu">${echap(variante.texte || "(vide)")}</span>`;
    entete.addEventListener("click", () => {
      if (cartesOuvertes.has(n)) cartesOuvertes.delete(n); else cartesOuvertes.add(n);
      ligne.classList.toggle("ouverte");
    });
    ligne.appendChild(entete);

    const ed = document.createElement("div");
    ed.className = "editeur";

    // --- Réglages de la carte (pour toutes les équipes) ---
    const etiquette = (txt) => {
      const l = document.createElement("label");
      l.textContent = txt;
      ed.appendChild(l);
      return l;
    };

    etiquette("Type d'épreuve (change la carte entière)");
    const selType = document.createElement("select");
    selType.style.cssText = "width:100%;border-radius:8px;border:1px solid #3a3a55;background:rgba(0,0,0,.45);color:#fff;padding:9px;font-family:inherit;font-size:14px";
    for (const t in TYPES) {
      const o = document.createElement("option");
      o.value = t; o.textContent = TYPES[t];
      if (t === carte.type) o.selected = true;
      selType.appendChild(o);
    }
    ed.appendChild(selType);

    const rangeeNombres = document.createElement("div");
    rangeeNombres.style.cssText = "display:flex;gap:8px";
    const champNombre = (cle, label, valeur) => {
      const bloc = document.createElement("div");
      bloc.style.cssText = "flex:1;display:flex;flex-direction:column;gap:3px";
      const l = document.createElement("label"); l.textContent = label;
      const i = document.createElement("input");
      i.type = "number"; i.min = "0"; i.value = valeur == null ? "" : valeur;
      i.dataset.meta = cle;
      i.style.cssText = "width:100%;border-radius:8px;border:1px solid #3a3a55;background:rgba(0,0,0,.45);color:#fff;padding:9px;font-family:inherit;font-size:14px";
      bloc.appendChild(l); bloc.appendChild(i);
      rangeeNombres.appendChild(bloc);
    };
    champNombre("points", "⭐ Points", carte.points);
    champNombre("perte", "💥 Perte si raté", carte.perte);
    champNombre("timer", "⏱ Chrono (s)", carte.timer);
    ed.appendChild(rangeeNombres);

    let selEffet = null, champValeur = null;
    if (carte.type === "bonus" || carte.type === "malus") {
      etiquette("Effet automatique");
      selEffet = document.createElement("select");
      selEffet.style.cssText = selType.style.cssText;
      const EFFETS = { "": "(aucun — juste annoncé)", double: "✨ Double points", vol: "🦝 Vol de points", gain: "💰 Gain direct", perte: "🌩 Perte directe", silence: "🤐 Interdiction de parler", "seconde-chance": "🔁 Seconde chance", sabotage: "🔧 Sabotage", choix: "🎯 Choix de la carte adverse", "defi-oblige": "🦆 Défi obligatoire" };
      for (const eft in EFFETS) {
        const o = document.createElement("option");
        o.value = eft; o.textContent = EFFETS[eft];
        if (eft === (carte.effet || "")) o.selected = true;
        selEffet.appendChild(o);
      }
      ed.appendChild(selEffet);
      etiquette("Valeur (pour vol / gain / perte)");
      champValeur = document.createElement("input");
      champValeur.type = "number"; champValeur.min = "0";
      champValeur.value = carte.valeur == null ? "" : carte.valeur;
      champValeur.style.cssText = selType.style.cssText;
      ed.appendChild(champValeur);
    }

    const sep = document.createElement("div");
    sep.style.cssText = "border-top:1px solid rgba(255,255,255,.15);margin:8px 0 2px";
    ed.appendChild(sep);

    // --- Contenu de la variante affichée (filtre actif) ---
    const champsUtiles = CHAMPS.filter(([cle]) =>
      cle in variante ||
      ["texte", "consigne", "reponse"].includes(cle) ||
      (cle === "indice" && carte.type === "triche") ||
      (cle === "secret" && carte.type === "mime") ||
      (cle === "youtube" && ["video", "blindtest", "doubleblindtest"].includes(carte.type)) ||
      (cle === "youtube2" && carte.type === "doubleblindtest") ||
      (cle === "musique" && ["blindtest", "doubleblindtest"].includes(carte.type)) ||
      (cle === "musique2" && carte.type === "doubleblindtest") ||
      (cle === "video" && carte.type === "video")
    );
    for (const [cle, label, tag] of champsUtiles) {
      etiquette(label);
      const champ = document.createElement(tag);
      champ.value = variante[cle] || "";
      champ.dataset.cle = cle;
      if (["musique", "musique2", "video"].includes(cle)) {
        const rangee = document.createElement("div");
        rangee.style.cssText = "display:flex;gap:8px";
        champ.style.flex = "1";
        rangee.appendChild(champ);
        const btnPC = document.createElement("button");
        btnPC.textContent = "📂 PC";
        btnPC.className = "violet";
        btnPC.style.cssText = "font-size:13px;padding:8px 12px";
        btnPC.title = "Choisir un fichier sur l'ordinateur (à valider sur le grand écran)";
        btnPC.addEventListener("click", () => {
          envoyer("fichierPC", { n, cible: filtreActif, champ: cle });
          notifier("📂 Regarde le grand écran pour choisir le fichier !");
        });
        rangee.appendChild(btnPC);
        ed.appendChild(rangee);
      } else {
        ed.appendChild(champ);
      }
    }

    // Propositions Duo / Carré / Cash pour les questions
    let inputsProps = null;
    if (["question", "triche", "piege"].includes(carte.type)) {
      etiquette("Duo/Carré/Cash — propositions (laisser vide pour désactiver)");
      inputsProps = [];
      const props = variante.propositions || [];
      const labels = ["✅ BONNE réponse", "✗ Piège 1", "✗ Piège 2", "✗ Piège 3"];
      labels.forEach((lb, i) => {
        const i2 = document.createElement("input");
        i2.placeholder = lb;
        i2.value = props[i] || "";
        i2.style.cssText = "width:100%;border-radius:8px;border:1px solid " + (i === 0 ? "#1d7a3a" : "#3a3a55") + ";background:rgba(0,0,0,.45);color:#fff;padding:9px;font-family:inherit;font-size:14px";
        ed.appendChild(i2);
        inputsProps.push(i2);
      });
    }

    const btn = document.createElement("button");
    btn.className = "enregistrer";
    btn.textContent = "💾 Enregistrer la carte " + n;
    btn.addEventListener("click", () => {
      const valeurs = {};
      ed.querySelectorAll("[data-cle]").forEach(ch => { valeurs[ch.dataset.cle] = ch.value.trim(); });
      if (inputsProps) {
        const props = inputsProps.map(i2 => i2.value.trim());
        valeurs.propositions = props.filter(Boolean).length >= 2 && props[0] ? props.filter(Boolean) : [];
      }
      const meta = { type: selType.value };
      rangeeNombres.querySelectorAll("[data-meta]").forEach(i2 => {
        meta[i2.dataset.meta] = i2.value === "" ? "" : +i2.value;
      });
      if (selEffet) meta.effet = selEffet.value;
      if (champValeur) meta.valeur = champValeur.value === "" ? "" : +champValeur.value;
      envoyer("majCarte", { n, carte: meta, variantes: { [filtreActif]: valeurs } });
      notifier("✔ Carte " + n + " enregistrée");
    });
    ed.appendChild(btn);
    ligne.appendChild(ed);
    liste.appendChild(ligne);
  }
  rendreJeux();
}

/* ------------------------------------------------ Mes jeux (configs nommées) */

function rendreJeux() {
  if (!catalogue) return;
  $("jeu-actif").textContent = catalogue.jeuActif
    ? "Jeu actif : « " + catalogue.jeuActif + " »"
    : "Jeu actif : cartes de base (non enregistré)";
  const zone = $("liste-jeux");
  zone.innerHTML = "";
  const jeux = catalogue.jeux || [];
  if (!jeux.length) {
    zone.innerHTML = "<div style='font-size:12px;color:rgba(255,255,255,.5)'>Aucun jeu enregistré. Personnalise tes cartes puis donne un nom à ta config !</div>";
    return;
  }
  for (const j of jeux) {
    const ligne = document.createElement("div");
    ligne.style.cssText = "display:flex;gap:6px;align-items:center";
    const nom = document.createElement("div");
    nom.style.cssText = "flex:1;font-size:14px;font-weight:700" + (j.nom === catalogue.jeuActif ? ";color:#7CFF9B" : "");
    nom.textContent = (j.nom === catalogue.jeuActif ? "▶ " : "") + j.nom;
    const date = document.createElement("div");
    date.style.cssText = "font-size:11px;color:rgba(255,255,255,.45)";
    date.textContent = new Date(j.date).toLocaleDateString("fr-FR");
    const bCharger = bouton("▶ Lancer", "bleu", () => {
      envoyer("chargerJeu", { nom: j.nom });
      notifier("▶ Jeu « " + j.nom + " » chargé");
    });
    bCharger.style.cssText = "font-size:12px;padding:8px 10px";
    const bSuppr = bouton("🗑", "rouge", () => {
      if (confirm("Supprimer le jeu « " + j.nom + " » ?")) {
        envoyer("supprimerJeu", { nom: j.nom });
        notifier("🗑 Jeu supprimé");
      }
    });
    bSuppr.style.cssText = "font-size:12px;padding:8px 10px";
    ligne.appendChild(nom); ligne.appendChild(date); ligne.appendChild(bCharger); ligne.appendChild(bSuppr);
    zone.appendChild(ligne);
  }
}

$("btn-sauver-jeu").addEventListener("click", () => {
  const nom = $("nom-jeu").value.trim();
  if (!nom) { notifier("⚠ Donne un nom à ton jeu"); return; }
  envoyer("sauverJeu", { nom });
  $("nom-jeu").value = "";
  notifier("💾 Jeu « " + nom + " » enregistré");
});

$("btn-defi").addEventListener("click", () => envoyer("defiSurprise"));

function notifier(txt) {
  const n = document.createElement("div");
  n.className = "notif";
  n.textContent = txt;
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2000);
}

/* Export : télécharge un cartes.js prêt à remplacer celui du site */
$("btn-exporter").addEventListener("click", () => {
  if (!catalogue) { notifier("⏳ Cartes pas encore reçues"); return; }
  const contenu = "/* Cartes exportées depuis la télécommande le " + new Date().toLocaleString("fr-FR") + "\n" +
    "   Remplace le fichier cartes.js du site par celui-ci pour rendre les modifications permanentes. */\n\n" +
    "const CONFIG = " + JSON.stringify({
      equipes: catalogue.equipes,
      premierTour: catalogue.premierTour,
      cartes: catalogue.cartes,
    }, null, 2) + ";\n";
  const blob = new Blob([contenu], { type: "text/javascript" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cartes.js";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  notifier("⬇ cartes.js téléchargé");
});

$("btn-retablir").addEventListener("click", () => {
  if (!confirmationCartes) {
    confirmationCartes = true;
    $("btn-retablir").textContent = "⚠ Toutes les modifs seront perdues — retouche pour confirmer";
    $("btn-retablir").classList.add("rouge");
    setTimeout(() => {
      confirmationCartes = false;
      $("btn-retablir").textContent = "↩ Rétablir les cartes d'origine";
      $("btn-retablir").classList.remove("rouge");
    }, 4000);
  } else {
    confirmationCartes = false;
    $("btn-retablir").textContent = "↩ Rétablir les cartes d'origine";
    $("btn-retablir").classList.remove("rouge");
    envoyer("resetCartes");
    notifier("↩ Cartes d'origine rétablies");
  }
});

/* ------------------------------------------------ Boutons fixes */

document.querySelectorAll("[data-cmd]").forEach(b => {
  b.addEventListener("click", () => {
    const cmd = b.dataset.cmd;
    if (cmd === "score") envoyer("score", { equipe: b.dataset.eq, delta: +b.dataset.d });
    else envoyer(cmd);
  });
});

$("btn-nouvelle").addEventListener("click", () => {
  if (!confirmationReset) {
    confirmationReset = true;
    $("btn-nouvelle").textContent = "⚠ Sûr ? Retouche pour confirmer";
    $("btn-nouvelle").classList.add("rouge");
    setTimeout(() => {
      confirmationReset = false;
      $("btn-nouvelle").textContent = "♻ Nouvelle partie";
      $("btn-nouvelle").classList.remove("rouge");
    }, 3000);
  } else {
    confirmationReset = false;
    $("btn-nouvelle").textContent = "♻ Nouvelle partie";
    $("btn-nouvelle").classList.remove("rouge");
    envoyer("reset");
  }
});

// Connexion automatique si un code est déjà mémorisé
if (dernierCode.length === 4) connecter();
</script>
